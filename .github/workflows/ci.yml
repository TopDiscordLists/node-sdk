name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  EXPECTED: '{"invalidSig":false,"malformed":false,"staleAcceptedNoTolerance":true,"staleRejected":false,"staleTs":false,"tamperedBody":false,"valid":true,"wrongSecret":false}'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test vectors match the canonical copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/TopDiscordLists/api-docs/main/test-vectors.json -o /tmp/canonical.json
          diff /tmp/canonical.json test-vectors.json && echo "vectors in sync"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Typecheck and build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Committed dist matches the build
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist is out of date, run npm run build and commit the result"
            git status --porcelain dist
            exit 1
          fi
          echo "dist matches the build"

      - name: Signature conformance
        run: |
          ACTUAL=$(node conformance/run.mjs 2>&1 | tail -1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "conformance FAILED"
            echo "  expected $EXPECTED"
            echo "  actual   $ACTUAL"
            exit 1
          fi
          echo "conformance passed, all 8 cases match"
